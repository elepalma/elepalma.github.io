members:
  - name: "Dr. Elena Palma"
    pub_name: "Palma E"
    photo: "/images/people/elepalma.JPG"
    initials: "EP"
    role: "Principal Investigator and Lecturer (Adj/Hon)"
    role_type: "pi"
    area: "Mitochondrial Medicine · ALD · Liver Cancer · Translational Research"
    bio: "Ele leads the Palma Lab at the Roger Williams Institute of Liver Studies, King's College London. With nearly 15 years of experience in hepatology research, her work focuses on developing novel multi-pronged treatments for alcohol-related liver disease and liver cancers. The lab uses translational experimental models to dissect fibrosis, inflammation, hepatotoxicity, liver regeneration, and mitochondrial dysfunction, bridging basic science and preclinical drug discovery. She holds a PhD in Cellular Biology and a degree in Pharmaceutical Chemistry and Technology from the University of Padova, Italy."
    twitter: "https://x.com/DrElePalma"
    linkedin: "https://www.linkedin.com/in/elena-palma-4400a52a/"
    researchgate: "https://www.researchgate.net/profile/Elena-Palma-2"
    orcid: ""
    gscholar: ""
    profile: "https://www.kcl.ac.uk/people/elena-palma"

  - name: "Dr. Meliz Sahuri-Arisoylu"
    pub_name: "Sahuri-Arisoylu M"
    photo: "/images/people/meliz.jpg"
    initials: "MA"
    role: "Research Fellow"
    role_type: "postdoc"
    area: "Mitochondrial Dynamics · ALD · MetALD"
    bio: "Meliz joined the Palma Lab in 2024 as a Postdoc Research Assistant. She holds an MSc and PhD from Imperial College London and brings experience from both academia and industry. Her current work investigates changes in mitochondrial dynamics and function in Alcohol-Related Liver Disease (ALD) and Metabolic Dysfunction and Alcohol-Related Steatotic Liver Disease (MetALD), with a particular focus on megamitochondria and their role in disease diagnosis and treatment."
    profile: "https://www.kcl.ac.uk/people/meliz-sahuri-arisoylu"

  - name: "Una Rastovic"
    pub_name: "Rastovic U"
    photo: "/images/people/una.jpg"
    initials: "UR"
    role: "PhD Student"
    role_type: "phd"
    area: "Mitochondrial Morphology · ALD · Liver Fibrosis"
    bio: "Una joined the Roger Williams Institute of Liver Studies as a Research Assistant in 2020 and started her PhD in the Palma Lab in 2023. She completed her BSc in Molecular Biology at the University of Zagreb and her MSc in Cancer Immunology and Biotechnology at the University of Nottingham. Her PhD investigates changes in mitochondrial morphology and function in ALD and liver fibrosis, with the aim of targeting mitochondria as a therapeutic strategy. She is a recipient of the Research Society on Alcohol Doctoral Students Small Grant."
    profile: "https://www.kcl.ac.uk/people/una-rastovic"
    awards:
      - "RSA Doctoral Student Small Grant - 2025"
      - "EASL Conference, Young Investigator travel award - 2023, 2024"
      - "ESBRA, Young Investigator award - 2023"
      - "BASL Basic Science Retreat, Best Science Abstract - 2023"

  - name: "Moyosoreoluwa Feyide"
    pub_name: "Feyide M"
    photo: "/images/people/moyo.jpeg"
    initials: "MF"
    role: "PhD Student"
    role_type: "phd"
    area: "CCA · Tumour Models · Drug Testing"
    profile: "https://www.kcl.ac.uk/people/moyosoreoluwa-feyide"
    bio: "Moyo joined the Palma Lab in 2022 for his MRes research project focused on liver cancer precision cut tumour slice models and returned in 2023 to start his PhD. His research has focused on advancing and characterising human cholangiocarcinoma organotypic models for drug testing and the study of mitochondrial dynamics in CCA."
    awards:
      - "Precision-BTC-Network, Short-term scientific mission grant (STSM) - 2025"
      - "DMM Conference Travel Grant - 2025"


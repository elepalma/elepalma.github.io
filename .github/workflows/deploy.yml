name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Monday 06:00 UTC) so build-time dates stay fresh:
    # opportunity badges (deadline/opens) are computed by Hugo at build time.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Hugo GitInfo can derive sitemap lastmod dates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned to the version documented in CLAUDE.md so CI and local builds match
          hugo-version: '0.157.0'
          extended: true

      - name: Lint and test
        # js/site-build.test.js builds the site with Hugo, so Hugo must be set up first
        run: npm test && npm run lint:html && npm run lint:safelist

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # Use the https baseURL from hugo.toml — configure-pages reports the
        # custom domain as http://, which poisons canonicals and the sitemap
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

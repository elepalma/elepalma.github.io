{{ define "main" }}

<div class="page-hero">
  <div class="max-w-wide mx-auto px-4 sm:px-8 lg:px-12 xl:px-20 py-6 sm:py-10">
    <p class="text-2xs font-semibold uppercase tracking-widest text-accent mb-2">Calendar</p>
    <h1 class="font-sans text-3xl sm:text-4xl xl:text-5xl tracking-tight text-ink">Events</h1>
    <p class="mt-3 text-sm text-ink-light max-w-xl">Upcoming conferences, seminars, and lab events.</p>
  </div>
</div>

<div class="max-w-wide mx-auto px-4 sm:px-8 lg:px-12 xl:px-20 py-6 sm:py-10">

  <!-- Upcoming -->
  <div class="mb-8">
    <h2 class="font-sans text-2xl tracking-tight mb-6 pb-3 border-b border-rule">Upcoming</h2>
    <div id="upcoming-list" class="divide-y divide-rule"></div>
    <p id="upcoming-empty" class="text-sm text-ink-faint py-4 hidden">No upcoming events at the moment.</p>
  </div>

  <!-- Past -->
  <div class="border-t border-rule pt-6">
    <h2 class="font-sans text-2xl tracking-tight mb-6">Past Events</h2>
    <div id="past-list" class="divide-y divide-rule"></div>
    <p id="past-empty" class="text-sm text-ink-faint py-4 hidden">No past events yet.</p>
  </div>

</div>

<!-- Hidden data source: Hugo emits all events as data attributes -->
<div id="event-data" class="hidden" aria-hidden="true">
  {{ range hugo.Data.events.events }}
  <div class="event-item"
    data-date="{{ .date }}"
    data-month="{{ .month }}"
    data-day="{{ .day }}"
    data-year="{{ .year }}"
    data-title="{{ .title }}"
    data-type="{{ .type }}"
    data-location="{{ .location }}"
    data-detail="{{ .detail }}"
    data-link="{{ .link }}">
  </div>
  {{ end }}
</div>

<script src="{{ "js/events-filter.js" | relURL }}"></script>
{{ end }}

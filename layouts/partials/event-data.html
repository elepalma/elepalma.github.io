{{/* Hidden data source: Hugo emits all events as data attributes; static/js/events-filter.js renders them client-side so "upcoming" is always relative to the visitor's date, not the build date. */}}
<div id="event-data" class="hidden" aria-hidden="true">
  {{ range hugo.Data.events.events }}
  <div class="event-item"
    data-date="{{ .date }}"
    data-month="{{ .month }}"
    data-day="{{ .day }}"
    data-year="{{ .year }}"
    data-title="{{ .title }}"
    data-type="{{ .type }}"
    data-location="{{ .location }}"
    data-detail="{{ .detail }}"
    data-link="{{ .link }}">
  </div>
  {{ end }}
</div>
